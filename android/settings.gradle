// The Pokédex as an Android app: a full-screen WebView showing the same
// pages as the desktop app, packed inside the APK. Built by GitHub Actions
// (.github/workflows/android.yml) whenever a new version is published.
pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = 'Pokedex'
include ':app'
